name: Deploy site to GitHub Pages

# The live site is served from the project's own Apache host (see update.sh --deploy).
# This workflow is an optional mirror on GitHub Pages. It runs only when started by hand
# from the Actions tab, and needs Settings → Pages → Source = "GitHub Actions" first.
# To deploy on every push instead, add under `on:`:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild diagrams and model downloads
        run: python tools/build_diagrams.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
